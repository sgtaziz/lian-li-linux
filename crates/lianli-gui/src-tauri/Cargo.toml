[package]
name = "lianli-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Tauri v2 + Vue 3 desktop GUI for Lian Li Linux"

[lib]
name = "lianli_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lianli-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dependencies]
lianli-control = { path = "../../lianli-control" }
lianli-shared = { path = "../../lianli-shared" }
tauri = { workspace = true, features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libc = { workspace = true }
tempfile = { workspace = true }
gio = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }

[features]
# This feature is used for production builds where the frontend is bundled.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
