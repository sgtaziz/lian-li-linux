name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libudev-dev \
          libusb-1.0-0-dev \
          libfontconfig-dev \
          pkg-config \
          nasm \
          libjpeg-turbo8 \
          libjpeg-turbo8-dev \
          libavcodec-dev \
          libavformat-dev \
          libswscale-dev \
          libavutil-dev \
          libevdi0-dev \
          libwebkit2gtk-4.1-dev \
          libglib2.0-dev \
          libgtk-3-dev \
          libsoup-3.0-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev

    - name: Setup bun
      uses: oven-sh/setup-bun@v2

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose
