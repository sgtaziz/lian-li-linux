name: Arch package

on:
  workflow_call:
    inputs:
      ref:
        description: Exact release commit or tag to package
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag to build (artifacts only; never publishes)
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install checkout prerequisites
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      # makepkg refuses to run as root, and the build user has to read the
      # root-owned checkout that the PKGBUILD clones from.
      - name: Create build user
        run: |
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          sudo -u builder git config --global --add safe.directory "$GITHUB_WORKSPACE"
          install -d -o builder artifacts
      - name: Build and check package
        run: |
          sudo -u builder bash packaging/archlinux/build.sh "$GITHUB_WORKSPACE/artifacts"
          pacman -U --noconfirm artifacts/*.pkg.tar.zst
          for binary in lianli-daemon lianli-gui lianli-session lianli-control; do
            test -x "/usr/bin/$binary"
            if ldd "/usr/bin/$binary" | grep 'not found'; then exit 1; fi
          done
      - uses: actions/upload-artifact@v6
        with:
          name: arch-x86_64
          path: artifacts/*.pkg.tar.zst
          if-no-files-found: error
